# Hongguo Drama 6.9: Windows installer candidate; publication is coordinated separately.
name: Windows x64 release candidate
on:
  workflow_dispatch:
    inputs:
      skip_playback:
        description: Skip player playback when the required acceptance footage is unavailable
        type: boolean
        default: false
      build_only:
        description: Build release assets without running unit, platform, or installer acceptance checks
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: ${{ runner.temp }}/media/artifacts
          key: windows-media-${{ hashFiles('scripts/build-ffmpeg-source-win.sh') }}
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 make pkg-config
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-source-win.sh "$RUNNER_TEMP/media" 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-media
          path: ${{ runner.temp }}/media/artifacts/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-media-errors
          path: ${{ runner.temp }}/media/logs/
  windows:
    needs: media
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: windows-media
          path: media
      - name: Prepare bundled FFmpeg and corresponding source
        shell: pwsh
        run: |
          Copy-Item media/bin/* build/ffmpeg/ -Force
          Copy-Item media/ffmpeg-9.0.2-x264-b35605a-win-x64-corresponding-source.tar.gz build/ffmpeg/ -Force
          Copy-Item media/ffmpeg-9.0.2-x264-b35605a-win-x64-corresponding-source.tar.gz build/ffmpeg/FFmpeg-Corresponding-Source.tar.gz -Force
      - name: Run unit and platform checks
        if: ${{ !inputs.build_only }}
        run: npm test
      - name: Check Windows FFmpeg discovery
        if: ${{ !inputs.build_only }}
        run: node scripts/check-ffmpeg-resolution.cjs
      - name: Validate FFmpeg corresponding-source archive
        shell: pwsh
        run: |
          $source = 'build/ffmpeg/FFmpeg-Corresponding-Source.tar.gz'
          if (-not (Test-Path -LiteralPath $source) -or (Get-Item -LiteralPath $source).Length -le 0) { throw 'FFmpeg/x264 corresponding-source archive is missing' }
          tar -tzf $source | Out-Null
          if ($LASTEXITCODE) { throw 'FFmpeg/x264 corresponding-source archive is invalid' }
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg-source-check'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          tar -xzf $source -C $tmp corresponding-source/WINDOWS-SHA256SUMS.txt
          if ($LASTEXITCODE) { throw 'FFmpeg/x264 corresponding-source archive has no media hash manifest' }
          $normalize = { param($lines) $lines | ForEach-Object { ($_ -split '\s+') -join ' ' } | Where-Object { $_ } | Sort-Object }
          $expected = & $normalize (Get-Content 'build/ffmpeg/WINDOWS-SHA256SUMS.txt')
          $actual = & $normalize (Get-Content (Join-Path $tmp 'corresponding-source/WINDOWS-SHA256SUMS.txt'))
          if (Compare-Object $expected $actual) { throw 'FFmpeg/x264 corresponding source does not match the bundled media binaries' }
      - uses: actions/cache/restore@v4
        id: app-cache
        with:
          path: |
            dist/win-unpacked
            dist/hongguo-downloader-*-win-x64-setup.exe
          key: windows-installer-v1-${{ hashFiles('package*.json', 'main.js', 'preload.js', 'index.html', 'vite.config.js', 'src/**', 'build/**', 'scripts/build-ffmpeg-source-win.sh') }}
      - shell: pwsh
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          npm run build:react
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version -replace '^(\d+\.\d+)\.0$', '$1'
          npx electron-builder --win nsis --x64 --publish never "-c.nsis.artifactName=hongguo-downloader-$version-win-x64-setup.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/cache/save@v4
        if: steps.app-cache.outputs.cache-hit != 'true'
        with:
          path: |
            dist/win-unpacked
            dist/hongguo-downloader-*-win-x64-setup.exe
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Verify x64 NSIS installer, isolated install, reinstall and real 1.80 upgrade
        if: ${{ !inputs.build_only }}
        shell: pwsh
        run: |
          node scripts/check-windows-installer.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assemble the Windows installer and update metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version -replace '^(\d+\.\d+)\.0$', '$1'
          Copy-Item "dist/hongguo-downloader-$version-win-x64-setup.exe" dist/windows-release/
          # v6.2–v6.6 安装版内置 electron-updater，下载更新前必须先取 latest.yml。
          node scripts/write-latest-yml.cjs "dist/windows-release/hongguo-downloader-$version-win-x64-setup.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist/windows-release | Select-Object Name, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: dist/windows-release/
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.build_only }}
        with:
          name: windows-verification
          path: dist/windows-verification/
