name: Verify live Windows update
on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Previous published Windows release tag
        type: string
        required: true
      to_tag:
        description: Current published Windows release tag
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: windows-live-update
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check in-app discovery, download, install and restart
        shell: pwsh
        env:
          FROM_TAG: ${{ inputs.from_tag }}
          TO_TAG: ${{ inputs.to_tag }}
        run: node scripts/verify-windows-live-update.cjs $env:FROM_TAG $env:TO_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-live-update
          path: dist/windows-live-update.*
          if-no-files-found: warn
