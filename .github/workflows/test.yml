# 源码回归检查，包含公开红果素材的真实解码。
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install real-media test tools
        uses: FedericoCarboni/setup-ffmpeg@8073ccb51e517ed576e6871c7f2360c6de4ebb7c # main, 2026-11-18
        with:
          ffmpeg-version: release
      - run: npm test
      - run: npm run build:react
      - name: Audit production dependencies and retain the complete build dependency report
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --json > npm-audit.json || jq -e '.metadata.vulnerabilities' npm-audit.json > /dev/null
          npm sbom --package-lock-only --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-evidence
          path: |
            npm-audit.json
            sbom.cdx.json
          if-no-files-found: error
