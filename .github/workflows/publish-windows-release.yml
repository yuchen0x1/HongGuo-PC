name: Publish validated Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      candidate_run_id:
        description: Successful Windows candidate workflow run ID
        required: true
        type: string
      test_run_id:
        description: Successful source test workflow run ID
        required: true
        type: string
      expected_commit:
        description: Exact commit SHA expected for the tag and CI runs
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tag and successful CI runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ && "$TEST_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          VERSION=${TAG#v}
          [[ "$(jq -r .version package.json)" == "$VERSION.0" ]]
          test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED_COMMIT"
          candidate=$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,headSha,workflowName --jq '[.conclusion, .headSha, .workflowName] | join(" ")')
          test "$candidate" = "success $EXPECTED_COMMIT Windows x64 release candidate"
          source_test=$(gh run view "$TEST_RUN_ID" --json conclusion,headSha,workflowName --jq '[.conclusion, .headSha, .workflowName] | join(" ")')
          test "$source_test" = "success $EXPECTED_COMMIT Test"
      - name: Prepare user-facing release notes
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release-notes.cjs "$TAG" release-notes.txt
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify installer and update metadata assets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          installer="hongguo-downloader-${version}-win-x64-setup.exe"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 2
          test "${assets[0]}" = "$installer"
          test "${assets[1]}" = "latest.yml"
          test -s "release-assets/$installer"
          test -s release-assets/latest.yml
          grep -qx "version: ${version}.0" release-assets/latest.yml
          grep -qx "path: $installer" release-assets/latest.yml
          grep -q "    size: $(stat -c%s "release-assets/$installer")" release-assets/latest.yml
          sha512=$(openssl dgst -sha512 -binary "release-assets/$installer" | openssl base64 -A)
          grep -q "sha512: $sha512" release-assets/latest.yml
      - name: Attach validated assets to draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          release=$(gh release view "$TAG" --json tagName --jq .tagName)
          test "$release" = "$TAG"
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --notes-file release-notes.txt --draft=false --prerelease=false
          installer=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith("setup.exe"))] | length')
          metadata=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(. == "latest.yml")] | length')
          test "$installer" -eq 1
          test "$metadata" -eq 1
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
